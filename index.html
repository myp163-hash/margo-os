<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Margo OS</title>
    <style>
        body { background: #0f172a; color: #38bdf8; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        h1 { border-right: 2px solid; white-space: nowrap; overflow: hidden; animation: typing 2s steps(8), blink .5s step-end infinite alternate; width: 8ch; font-size: 3rem; }
        @keyframes typing { from { width: 0 } }
        @keyframes blink { 50% { border-color: transparent } }
    </style>
</head>
<body>
    <h1>Margo OS</h1>
</body>
</html>
